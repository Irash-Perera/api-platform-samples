openapi: 3.0.3
info:
  title: Trip Planning Agent
  version: 1.0.0

paths:
  /.well-known/agent-card.json:
    get:
      summary: Agent Card discovery document
      responses:
        '200':
          description: The Agent Card
          content:
            application/json:
              schema:
                type: object
  /rpc:
    post:
      summary: A2A JSON-RPC transport, every operation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: JSON-RPC result
          content:
            application/json:
              schema:
                type: object

  # The HTTP+JSON binding gives each operation its own route, so Choreo needs
  # each one declared; a single wildcard would not match the GET.
  /rest/message:send:
    post:
      summary: SendMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: The task
          content:
            application/json:
              schema:
                type: object

  /rest/message:stream:
    post:
      summary: SendStreamingMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: A stream of task events
          content:
            text/event-stream:
              schema:
                type: string

  /rest/tasks/{id}:
    get:
      summary: GetTask
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The task
          content:
            application/json:
              schema:
                type: object

  /rest/tasks/{id}:cancel:
    post:
      summary: CancelTask
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: The cancelled task
          content:
            application/json:
              schema:
                type: object
